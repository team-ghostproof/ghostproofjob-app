name: SEO Refresh (weekly)

# Regenerates the static SEO pages from LIVE job data and commits any changes,
# so the city pages + the per-company "Jobs at {Company}" pages stay honest
# ("recently seen" must reflect the current pool as postings churn). Static
# output = ZERO runtime reads to serve. Safe: the honesty model is enforced by
# `npm run test:seo`, which must pass before anything is committed.
on:
  schedule:
    - cron: '0 8 * * 1'      # Mondays 08:00 UTC (after the harvest, before traffic)
  workflow_dispatch:

permissions:
  contents: write
  issues: write          # N12: failure alert opens/comments a workflow-failure issue

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install deps
        run: npm install
      - name: Guardrail tests (honesty model must hold before we publish)
        run: npm run test:seo
      - name: Regenerate SEO pages from live data
        run: npm run seo:build
      - name: Commit changed pages (if any)
        run: |
          git config user.name  "gpj-seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add seo/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No SEO changes this week."
          else
            git commit -m "chore(seo): weekly refresh of city + company pages from live data"
            git push
          fi
      # N12 (founder-approved): alert on a silent cron failure via a workflow-failure issue.
      - name: Alert on failure (N12)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.workflow;
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🔴 ${wf} FAILED`;
            const body = `🔴 **${wf}** failed.\n\n**Run:** ${url}\n**When:** ${new Date().toISOString()}\n\nOpen the run log for the failing step + error.`;
            const found = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'workflow-failure', per_page: 30 });
            const hit = found.data.find(i => i.title === title);
            if (hit) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['workflow-failure'] });
