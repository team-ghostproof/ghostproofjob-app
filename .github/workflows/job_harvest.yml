name: Daily Job Harvest
# NORMAL mode runs automatically every day on the cron below.
# STACKING mode is a manual trigger: Actions tab -> "Daily Job Harvest" ->
# "Run workflow" -> mode: stack. Use it for 2-3 days to flood the DB, then
# just stop triggering it — the daily cron stays on NORMAL and (on day 7)
# resumes pruning automatically. Public repo = free Actions minutes.
on:
  schedule:
    - cron: '0 5 * * *'        # 5:00 AM UTC daily (NORMAL)
  workflow_dispatch:
    inputs:
      mode:
        description: 'stack = aggressive multi-hour pull, pruning OFF  ·  normal = standard daily'
        type: choice
        options: [normal, stack]
        default: normal
jobs:
  harvest:
    runs-on: ubuntu-latest
    # 6h cap for a stacking run, 60m for normal. (Public-repo runners allow 360.)
    timeout-minutes: ${{ github.event.inputs.mode == 'stack' && 360 || 60 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Gate: validate the parsers offline before spending any harvest budget.
      # If salary/requirements/doc_id parsing ever regresses, this fails fast.
      - name: Validate parsers (offline self-test)
        run: python scripts/job_spy_harvester.py --selftest
      - name: Run JobSpy harvester
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STACKING_MODE: ${{ github.event.inputs.mode == 'stack' && '1' || '0' }}
          # ~5h40m budget leaves headroom under the 360m hard cap to stop cleanly.
          RUN_BUDGET_SECS: ${{ github.event.inputs.mode == 'stack' && '20400' || '3120' }}
          # Capture sources + optional employer-page backfill — set via repo Variables
          # (Settings -> Secrets and variables -> Actions -> Variables). The || fallbacks
          # mean an UNSET variable resolves to the harvester's exact current defaults, so
          # adding these changes NOTHING until you opt in (e.g. SITES=linkedin,indeed,google
          # or BACKFILL_MAX=50). Never leave a variable set to an empty value.
          SITES: ${{ vars.SITES || 'linkedin,indeed' }}
          BACKFILL_MAX: ${{ vars.BACKFILL_MAX || '0' }}
        run: python scripts/job_spy_harvester.py

      # ---------------------------------------------------------------------
      # D1: rebuild the pre-computed job pool immediately after the harvest, so
      # the snapshot the app reads is as fresh as the data itself.
      #
      # WHY IT LIVES HERE: this is the read-cost fix. Every candidate session used
      # to rebuild the deck from thousands of individual job reads; it now reads
      # ~1-8 aggregate pool docs instead. Running it right after the harvest keeps
      # the pool at most one cycle behind the source.
      #
      # `if: always()` — a PARTIAL harvest (budget timeout, a source erroring) still
      # leaves a perfectly good pool to rebuild from. Skipping on failure would
      # strand the app on yesterday's pool for no reason.
      # `continue-on-error` — the pool is an OPTIMISATION, never a dependency: the
      # client falls back to the live query whenever a pool is missing or stale, so
      # a failure here must not turn the harvest red.
      - name: Set up Node 20 (job pool builder)
        if: always()
        uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Rebuild the D1 job pool
        if: always()
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # The SAME secret is proven-valid: the Python harvester above writes jobs
          # with it every day. So a failure here is in THIS Node step, not the creds.
          # Each stage below fails with a distinct titled annotation so the ONE thing
          # that's actually wrong is unmistakable in the run summary.
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error title=D1 pool: secret missing::FIREBASE_SERVICE_ACCOUNT resolved empty in this run."
            exit 1
          fi
          echo "node $(node --version) · npm $(npm --version)"
          echo "→ installing firebase-admin (pinned to the repo's ^12.1.0)…"
          npm install firebase-admin@^12.1.0 --no-save --no-audit --no-fund \
            || { echo "::error title=D1 pool: npm install failed::firebase-admin did not install — see the npm error above."; exit 1; }
          node -e "import('firebase-admin').then(m=>console.log('✓ firebase-admin '+m.default.SDK_VERSION+' loaded')).catch(e=>{console.error('::error title=D1 pool: firebase-admin load failed::'+e.message);process.exit(1);})" \
            || exit 1
          echo "→ running the pool builder (it prints the active-job count it read, then any failure)…"
          node scripts/build_job_pool.mjs \
            || { echo "::error title=D1 pool: build_job_pool.mjs failed::see the [pool] failed: … line above for the exact reason (read/write/OOM/timeout)."; exit 1; }

      # ── D1 GUARDRAIL (v186) ────────────────────────────────────────────────
      # The build above is continue-on-error so a pool failure never turns the
      # harvest red — which is EXACTLY how the pool stayed silently unbuilt for
      # months (the step reported "success" while writing nothing). This step
      # reads the PUBLIC manifest back and FAILS VISIBLY if the pool was not
      # freshly written this run, so the breakage can never hide again. Jobs are
      # already harvested + written by this point, so a red here means ONLY the
      # read-cost optimisation is off, not that the harvest failed.
      - name: Verify the D1 pool was written
        if: always()
        run: |
          MAN=$(curl -s --max-time 25 "https://firestore.googleapis.com/v1/projects/ghostproofjob-app/databases/(default)/documents/job_pools/_manifest")
          echo "manifest response (head):"; echo "$MAN" | head -c 500; echo
          BUILT=$(echo "$MAN" | grep -oE '"builtAt"[^,}]*' | head -1)
          if [ -n "$BUILT" ]; then
            echo "::notice title=D1 pool OK::job_pools/_manifest present ($BUILT). The app reads the pool instead of thousands of live docs."
          else
            echo "::error title=D1 pool MISSING::job_pools/_manifest was NOT written this run — the app is on the expensive live-query fallback. Jobs harvested fine; only the D1 optimisation is off. Fix: check the 'Rebuild the D1 job pool' step log + the FIREBASE_SERVICE_ACCOUNT secret."
            exit 1
          fi
