name: Resources Article

# Publishes ONE data-grounded Resources article per run into /resources/, rebuilds
# the hub + manifest, and commits the static files back to the repo. The market
# numbers are read from the tiny resources/_market_stats doc that the Daily Job
# Harvest's pool builder writes for free — this job does NOT scan the jobs
# collection, so it costs ~1 Firestore read ([FREE-TIER]).
#
# GO-LIVE (2026-08-24, founder-approved): the founder has manually run + reviewed the
# publisher, so the every-other-day cadence is now ON. Manual dispatch stays available.
# Safe to auto-run: the generator is grounded (never fabricates a number, returns null on
# thin data), costs ~1 Firestore read (reads the tiny resources/_market_stats doc, never
# the jobs collection), and only commits when there is a genuinely new article.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 2-30/2 * *'   # 13:00 UTC, every other day (GO-LIVE 2026-08-24)

permissions:
  contents: write   # needed to commit the generated article back to the repo

concurrency:
  group: resources-refresh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Install firebase-admin
        # package-lock.json is gitignored, so `npm ci` can't run here — install the
        # one dep the generator needs directly (same pattern the harvest's pool step
        # uses). The generator reads the market snapshot via the admin SDK, which
        # bypasses Firestore rules (there is deliberately no public `resources` rule).
        run: |
          echo "node $(node --version) · npm $(npm --version)"
          npm install firebase-admin@^12.1.0 --no-save --no-audit --no-fund \
            || { echo "::error title=Resources: npm install failed::firebase-admin did not install."; exit 1; }

      - name: Generate the next article
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning title=Resources::FIREBASE_SERVICE_ACCOUNT is empty — the generator can't read the market snapshot. Nothing published."
          fi
          # If the market snapshot isn't there yet (pool builder hasn't run since
          # the D1 fix), the generator exits 0 without publishing — not an error.
          node scripts/build_resources.mjs

      - name: Commit the new article
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/
          if git diff --cached --quiet; then
            echo "No new article this run (no fresh stats, or duplicate) — nothing to commit."
          else
            git commit -m "resources: publish the next data-grounded article [skip ci]"
            git push
            echo "::notice title=Resources::Published a new article. The sitemap picks it up on the next SEO refresh."
          fi
