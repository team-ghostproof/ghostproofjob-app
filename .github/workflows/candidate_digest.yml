name: Candidate digest (weekly)

# ONE batched weekly email per candidate, assembled from up to three sections — each gated by
# its OWN "Also email me" sub-toggle (v282/v283), which DEFAULTS OFF, so nothing is emailed for
# a section a candidate did not explicitly opt into:
#   • top new job matches (scored with the SAME engine as the app, api/match/scoreCore)
#   • a ghost-risk heads-up on companies they APPLIED to that the community has flagged
#   • a nudge to rate a company they applied to but haven't rated yet
# The in-app bell toggles never authorise email. Honors the canonical email opt-out
# (email_suppress + emailUnsub) and appends the shared CAN-SPAM unsubscribe footer.
# [FREE-TIER] bounded reads: one pool read + one profiles read + one ghost_reports read +
# one email_suppress read, ALL shared across every candidate.
#
# GO-LIVE GATE — read before enabling:
#   • workflow_dispatch is ON so the founder can run a DRY-RUN by hand. In DRY-RUN the script
#     does ALL the real work but emails ONLY a preview to the founder (DIGEST_TEST_EMAIL) —
#     never a real candidate.
#   • The weekly `schedule` cron stays COMMENTED, and `DIGEST_LIVE` stays unset, until the
#     founder has run the dry-run, reviewed the preview email, and is happy with it.
#   • To go live: uncomment the cron AND set DIGEST_LIVE: '1' below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 14 * * 1'      # Mondays 14:00 UTC — UNCOMMENT after the dry-run is approved

concurrency:
  group: cand-digest
  cancel-in-progress: true

jobs:
  digest:
    name: "Weekly candidate matches digest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci || npm install
      - name: Send the digest (DRY-RUN unless DIGEST_LIVE=1)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # DIGEST_LIVE: '1'    # UNCOMMENT to email real candidates (only after the dry-run is approved)
        run: node scripts/candidate_digest.mjs
