name: Reverse Match (nightly)

# Recomputes employer-job → candidate recommendations from the OPTED-IN pool.
# Backend/async only — never runs on the candidate hot path. Reads are bounded
# by caps in the runner (D1-conscious). Needs the same FIREBASE_SERVICE_ACCOUNT
# secret the harvester uses. Safe no-op if the secret is absent.
on:
  schedule:
    - cron: '30 6 * * *'      # 06:30 UTC daily (after the 05:00 harvest)
  workflow_dispatch:

jobs:
  reverse-match:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # N12: failure alert opens/comments a workflow-failure issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: npm install
      - name: Pipeline unit tests (must pass before writing)
        run: npm run test:match
      - name: Run reverse match
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node api/match/runNightly.js
      # v120: email the founders when the review queue has work waiting — nobody
      # sits pending unnoticed. No-ops safely without RESEND_API_KEY (logs counts).
      - name: Admin pending-approvals digest
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/admin_digest.mjs
      # N12 (founder-approved): if any step above failed, open/comment a "workflow-failure"
      # issue so a silent cron failure pings the founder (GitHub emails on issue activity).
      - name: Alert on failure (N12)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const wf = context.workflow;
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🔴 ${wf} FAILED`;
            const body = `🔴 **${wf}** failed.\n\n**Run:** ${url}\n**When:** ${new Date().toISOString()}\n\nOpen the run log for the failing step + error.`;
            const found = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'workflow-failure', per_page: 30 });
            const hit = found.data.find(i => i.title === title);
            if (hit) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['workflow-failure'] });
